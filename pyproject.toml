[project]
name = "agentic-rag-chatbot-azure-native"
version = "0.2.26"
description = "Enterprise-ready Azure-native Agentic RAG Chatbot"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
keywords = ["azure", "rag", "agentic", "llamaindex", "chainlit", "pandas"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "chainlit==2.12.0",
  "llama-index==0.14.24",
  "llama-index-llms-azure-openai==0.5.5",
  "llama-index-embeddings-azure-openai==0.5.2",
  "llama-index-vector-stores-azureaisearch==0.5.0",
  "azure-identity==1.25.3",
  "azure-keyvault-secrets==4.11.2",
  "azure-storage-blob==12.30.1",
  "azure-cosmos==4.16.3",
  "azure-search-documents==11.6.0",
  "azure-ai-projects==2.4.0",
  "openai>=2.8.0,<3",
  "pandas==3.0.5",
  "python-dotenv==1.2.3",
  "httpx==0.28.1",
  "requests>=2.32.0,<3",
  "PyMuPDF>=1.26.0,<2",
  "celery>=5.6.0,<6",
  "boto3>=1.42.0,<2",
  "botocore>=1.42.0,<2",
  "pymongo>=4.15.0,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio>=1.2.0,<2",
  "ruff>=0.12.0,<1",
  "mypy>=1.17.0,<2",
  "pyright>=1.1.400,<2",
  "build>=1.3.0,<2",
]

[project.scripts]
agentic-rag = "agentic_rag_chatbot_enterprise_ready.cli:cli"

[build-system]
requires = ["setuptools>=78,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["app_logger"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["*_upgraded.py", "old.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
