name: quality

on:
  push:
    branches: ["main", "refactor/**", "chore/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src main.py
      - name: Apply safe Ruff fixes for remediation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/ci-lint-reliability-v62'
        run: >-
          ruff check --fix
          app_logger.py
          main.py
          src/agentic_rag_chatbot_enterprise_ready/auth
          src/agentic_rag_chatbot_enterprise_ready/backend/reliability
          src/agentic_rag_chatbot_enterprise_ready/backend/orchestration
          src/agentic_rag_chatbot_enterprise_ready/backend/runtime.py
          src/agentic_rag_chatbot_enterprise_ready/cli.py
      - name: Commit safe Ruff fixes for remediation branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/ci-lint-reliability-v62'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_logger.py main.py src/agentic_rag_chatbot_enterprise_ready
          git commit -m "chore: apply Ruff safe fixes"
          git push
      - name: Ruff maintained application surfaces
        run: >-
          ruff check
          app_logger.py
          main.py
          src/agentic_rag_chatbot_enterprise_ready/auth
          src/agentic_rag_chatbot_enterprise_ready/backend/reliability
          src/agentic_rag_chatbot_enterprise_ready/backend/orchestration
          src/agentic_rag_chatbot_enterprise_ready/backend/runtime.py
          src/agentic_rag_chatbot_enterprise_ready/cli.py
      - name: Pylance-compatible type check
        run: pyright
      - name: Tests
        run: pytest
      - name: Build wheel
        run: python -m build --wheel
